<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada — Ana Callejón</title>
<meta name="robots" content="noindex">
<link rel="icon" href="https://ik.imagekit.io/anacallejon/portfolio_img/favicon_editorial_2/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="https://ik.imagekit.io/anacallejon/portfolio_img/favicon_editorial_2/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://ik.imagekit.io/anacallejon/portfolio_img/favicon_editorial_2/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --paper: #f2efe9; --ink: #141413; --muted: #6d6962; --accent: #4a68b5; }
  @media (prefers-color-scheme: dark) { :root { --paper: #121211; --ink: #ece8e0; --muted: #8e8a82; } }
  body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; justify-content: center;
         padding: 0 clamp(16px, 3.6vw, 48px); background: var(--paper); color: var(--ink);
         font-family: "Inter Tight", "Helvetica Neue", Arial, sans-serif; }
  .lbl { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
  h1 { margin: 16px 0 24px; font-family: "Instrument Serif", Georgia, serif; font-weight: 400;
       font-size: clamp(56px, 12vw, 200px); line-height: 0.9; letter-spacing: -0.03em; }
  h1 em { color: var(--accent); }
  a { color: inherit; font-size: 16px; }
  a:hover { color: var(--accent); }
</style>
</head>
<body>
  <span class="lbl">Error 404</span>
  <h1>Página no <em>encontrada</em></h1>
  <a id="home" href="/">← Volver al inicio</a>
  <script>
    // En GitHub Pages el sitio vive en /nombre-del-repo/: el enlace apunta ahí.
    if (location.hostname.endsWith("github.io")) {
      var seg = location.pathname.split("/")[1];
      if (seg) document.getElementById("home").href = "/" + seg + "/";
    }
  </script>
</body>
</html>
